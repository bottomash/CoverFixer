name: Build CoverFixer DLL

on:
  push:
    branches:
      - main
    paths-ignore:
      - CoverFixer.dll
  workflow_dispatch:

concurrency:
  group: coverfixer-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and commit DLL
    runs-on: windows-latest
    env:
      EMBY_VERSION: 4.9.5.0
      EMBY_ARCHIVE_SHA256: 6883356517a42316ef5b270081f81d8de4151fec384fbe1ec1b31d2cf77688f6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Emby assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = Join-Path $env:RUNNER_TEMP "embyserver-win-x64-$env:EMBY_VERSION.7z"
          $extractRoot = Join-Path $env:RUNNER_TEMP "emby-$env:EMBY_VERSION"
          $uri = "https://github.com/MediaBrowser/Emby.Releases/releases/download/$env:EMBY_VERSION/embyserver-win-x64-$env:EMBY_VERSION.7z"

          Invoke-WebRequest -Uri $uri -OutFile $archive

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:EMBY_ARCHIVE_SHA256) {
            throw "Emby archive SHA256 校验失败：$actualHash"
          }

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $sevenZip -and (Test-Path -LiteralPath 'C:/Program Files/7-Zip/7z.exe')) {
            $sevenZip = 'C:/Program Files/7-Zip/7z.exe'
          }
          if (-not $sevenZip) {
            throw 'GitHub Actions runner 中未找到 7-Zip'
          }

          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          & $sevenZip x $archive "-o$extractRoot" -y
          if ($LASTEXITCODE -ne 0) {
            throw "解压 Emby 程序包失败，退出码：$LASTEXITCODE"
          }

          $controllerAssembly = Get-ChildItem -LiteralPath $extractRoot -Filter 'MediaBrowser.Controller.dll' -Recurse -File | Select-Object -First 1
          if ($null -eq $controllerAssembly) {
            throw '解压结果中未找到 MediaBrowser.Controller.dll'
          }

          "EMBY_SERVER_PATH=$($controllerAssembly.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: dotnet restore ./tests/CoverFixer.Tests.csproj --nologo -p:EmbyServerPath="$env:EMBY_SERVER_PATH"

      - name: Build plugin
        shell: pwsh
        run: dotnet build ./src/CoverFixer.csproj -c Release --no-restore --nologo -p:EmbyServerPath="$env:EMBY_SERVER_PATH"

      - name: Build tests
        shell: pwsh
        run: dotnet build ./tests/CoverFixer.Tests.csproj -c Release --no-restore --nologo -p:EmbyServerPath="$env:EMBY_SERVER_PATH"

      - name: Run tests
        shell: pwsh
        run: dotnet run --project ./tests/CoverFixer.Tests.csproj -c Release --no-build --no-restore --nologo -p:EmbyServerPath="$env:EMBY_SERVER_PATH"

      - name: Copy DLL to repository root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = './src/bin/Release/net8.0/CoverFixer.dll'
          $destination = './CoverFixer.dll'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "构建产物不存在：$source"
          }

          Copy-Item -LiteralPath $source -Destination $destination -Force
          $version = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path -LiteralPath $destination).Path).Version
          Write-Host "已生成 CoverFixer.dll，版本：$version"

      - name: Commit DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CoverFixer.dll
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'CoverFixer.dll 没有变化，不创建提交。'
            exit 0
          }

          git commit -m 'build: update CoverFixer.dll'
          if ($LASTEXITCODE -ne 0) {
            throw "提交 DLL 失败，退出码：$LASTEXITCODE"
          }

          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "推送 DLL 提交失败，退出码：$LASTEXITCODE"
          }
